version: '3.8'

services:
  mahasetu-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahasetu-portal
    restart: always
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/mahasetu
      - JWT_SECRET=${JWT_SECRET:-mahasetu_secure_gujarat_prod_secret_2025}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads

  mongo:
    image: mongo:7.0
    container_name: mahasetu-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  uploads_data:
